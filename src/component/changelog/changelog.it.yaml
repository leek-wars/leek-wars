250:
  title: "WIP"
  added:
    - "La console LeekScript diventa la Console: esegui anche JavaScript, TypeScript e Python in modo interattivo, con lo stato conservato tra le righe."
    - "#ai L'editor Python diventa un vero IDE: autocompletamento di funzioni, variabili e moduli con inferenza dei tipi, hover con il tipo di un simbolo e dove è definito, Ctrl+clic per andare alla definizione, e risoluzione degli import tra le tue IA."
    - "Nuova arma da mischia, la Sciabola del deserto (livello 151, leggendaria): da 75 a 85 danni e il bersaglio diventa Sterile per 2 turni, non può più evocare. Si fabbrica alla forgia, con uno schema che si trova combattendo sulla mappa del deserto."
    - "Nuova arma, la Lancia del sole (livello 201): infilza un'intera linea da 1 a 4 caselle e respinge i bersagli di 4 caselle, 5 con un colpo critico. Si fabbrica alla forgia con schegge solari del Solstizio, il suo schema si ottiene come ricompensa di combattimento."
    - "4 nuovi cappelli: il Basco e il Cappello da chef nel negozio, più il Cappello da spiaggia e la Corona solare da fabbricare alla forgia con le risorse del Solstizio."
  improved:
    - "Gruppi privati: la modalità « account con password » (credenziali scelte dal supervisore, senza e-mail dei membri) si regola ora nelle impostazioni del gruppo, e i gruppi demo la attivano di default."
    - "#ai L'API JavaScript, TypeScript e Python diventa 100% orientata agli oggetti: niente più funzioni o costanti globali, tutto passa dagli oggetti (Fight, me, Weapon.pistol, System.operations, Network, Color...). La stdlib LeekScript è sostituita dai nativi del linguaggio (Math, JSON, random...)."
    - "#ai Tipi dell'API JavaScript, TypeScript e Python affinati (grazie a Nyaleph): le famiglie di costanti sono ora indicate nelle firme (Entity.Stat, Fight.Use, Item.Area...), Item porta finalmente ciò che armi e chip hanno in comune, e i registri sono tipizzati come testo. Attenzione: un'IA che usa il valore di ritorno di Registers.delete, o un valore di registro direttamente come numero, segnalerà ora un errore: usa parseInt."
    - "#ai API JavaScript, TypeScript e Python: Effect.item restituisce ora l'arma o il chip stesso invece del suo numero, si può risalire a un oggetto dal suo identificatore (Cell.get, Entity.get, Weapon.get, Chip.get, Item.get), e gli oggetti restituiti dall'API sono condivisi e in sola lettura, quindi confrontabili per identità (me.cell === me.cell). Le costanti EFFECT_MODIFIER_* e EFFECT_TARGET_* sono raggruppate in Effect.Modifier.* e Effect.Target.* (grazie a Nyaleph)."
    - "#ai Lo switch non prova più i casi uno per uno: quando tutti i casi sono numeri o testi costanti, il ramo giusto viene trovato direttamente, e lo switch costa una sola operazione invece di una per ogni caso provato. Uno switch di 10 casi su testi passa da 71 a 8 operazioni per passaggio."
    - "#ai Confrontare due oggetti con == o != è circa 3 volte più veloce: il confronto avviene ora direttamente, invece di passare da una lunga serie di controlli di tipo. Array, mappe e insiemi continuano a confrontarsi sul loro contenuto."
    - "Le classifiche dei boss si decidono ora sull'impresa e non più sull'anzianità: a parità, « Il più veloce » confronta il numero di porri poi il loro livello, « Meno porri » confronta i turni poi il livello, e « Livello più basso » confronta i porri poi i turni. La data della run decide solo come ultima risorsa."
    - "L'eliminazione dell'account è ora possibile per i creatori di squadra: la squadra passa al membro più anziano, o viene sciolta se il creatore era solo."
    - "#ai Le costanti deprecate (EFFECT_BUFF_FORCE, USE_FAILED...) non sono più proposte nell'API JavaScript, TypeScript e Python: esistono solo i nomi attuali (Effect.BUFF_STRENGTH...) (grazie a WiseMan)."
    - "#ai La documentazione delle costanti STATE_* elenca ora le armi e i chip che applicano lo stato, come le altre famiglie di costanti."
    - "I trofei Medium e Oracolo diventano trofei bonus, senza punti né habs. I trofei Distruttore di Nasu, di Fenouil e di Potiron salgono a 30, 50 e 80 punti per mantenere un totale tondo di 18 000 punti, e i punteggi trofei di tutti gli allevatori sono stati ricalcolati."
    - "Le armi fabbricabili (Sciabola del deserto, Lancia del sole) compaiono ora nella collezione e al mercato: in grigio finché non si trova il diagramma, con un pulsante Fabbrica che porta all'inventario mettendo gli ingredienti direttamente nella forgia."
    - "#ai API JavaScript, TypeScript e Python: le funzioni di puntamento si chiamano ora su Fight (Fight.weaponCells, Fight.chipCell, Fight.weaponTargets...), e non più solo su me. Non dipendono da nessuna entità in particolare — l'arma equipaggiata è solo un valore predefinito — quindi Fight.weaponCells(cella, nemico.weapon) dice da dove il nemico può colpire quella cella. Restano richiamabili su me (grazie a GSoMan)."
    - "La forgia segnala in rosso gli ingredienti mancanti e rifiuta la fabbricazione finché non ci sono tutti."
    - "#ai Il pannello dei problemi dell'editor non si apre più all'arrivo quando non c'è nessun errore, avviso o TODO da mostrare."
  fixed:
    - "Documentazione: durante una ricerca, le categorie si richiudono di nuovo cliccando sulla loro freccia (grazie a hypernavet)."
    - "Una composizione di squadra che non ha più abbastanza porri per essere sfidata nell'orto non appare più come attiva in classifica: vi manteneva il suo talento senza mai rimetterlo in gioco (grazie a tagadagain)."
    - "#ai Assegnare un valore a un campo tipizzato di una classe tramite una variabile non tipizzata (any) applica ora le stesse conversioni del codice tipizzato, invece di fallire in combattimento con un falso errore \"campo sconosciuto\" (grazie a Bily)."
    - "La modalità preferita in arena non cambia più da sola: il comando /br della chat iscriveva senza preferenza, e un cambio di modalità dal menu veniva dimenticato alla successiva iscrizione dall'orto."
    - "Gli ostacoli delle mappe dei boss (bastioni del castello, torii...) sono ora disegnati con la loro dimensione reale sulla mappa degli spostamenti del rapporto, senza più buchi che sembravano attraversabili (grazie a TheScout)."
    - "Modalità Colosso: i PV dei bulbi evocati dal colosso sono finalmente sincronizzati tra client e server. Il loro bonus di statistiche veniva contato due volte nella visualizzazione, così un bulbo sembrava tre volte più resistente e moriva con la barra della vita piena per due terzi. Anche i combattimenti già registrati vengono ora riprodotti correttamente."
    - "Il ruolo referente diventa discreto come gli altri ruoli in modalità discreta: nome senza grassetto nella chat e badge di grado sobrio (grazie a Portevent)."
    - "#ai API JavaScript, TypeScript e Python: Field.distance restituisce ora una distanza in numero di caselle, come Cell.distance e Entity.distance, invece della distanza in linea d'aria. La distanza in linea d'aria resta disponibile con Field.euclideanDistance (grazie a GSoMan)."
    - "#ai Il Bazooka al plutonio ha finalmente la sua costante WEAPON_PLUTONIUM_BAZOOKA: era l'unica arma a non averne una. Ora compare nella documentazione e nel completamento automatico, e Weapon.plutoniumBazooka non viene più segnalato come errore in JavaScript, TypeScript e Python, benché funzionasse già in combattimento (grazie a DesignThinkerer)."
    - "#ai API JavaScript, TypeScript e Python: indicare un'arma a me.weaponCell, me.weaponCells, me.weaponTargets o me.canUseWeapon funziona finalmente. La lista tornava vuota e in Python la parola chiave weapon veniva rifiutata: gli argomenti arrivavano al motore in ordine inverso. Questi metodi prendono prima il bersaglio e poi l'arma, come da documentazione, e l'ordine inverso resta accettato (grazie a GSoMan)."
    - "La pagina Inventario non va più in crash al primo bottino di una nuova stagione: le risorse di una stagione (Sabbia dorata, Ambra marina...) sono ora pubblicate automaticamente il giorno prima del suo inizio."
    - "Le stagioni iniziano e finiscono ora a mezzanotte ora francese, invece che alle 2 del mattino."
    - "L'editor non genera più un errore a ogni battitura sulle vecchie versioni di Safari (iPhone e iPad con iOS 15): il rilevamento dei colori di Monaco usava un'espressione regolare che quei browser non comprendono."
    - "Git: push, pull e aggiornamento ora funzionano qualunque sia il nome del repository remoto. Un remote chiamato diversamente da «origin» faceva fallire tutte le operazioni di rete con «fatal: transport 'file' not allowed» e lasciava il selettore dei branch senza alcun branch remoto. Anche il fallimento di un aggiornamento viene ora segnalato, invece di passare inosservato."
    - "Il selettore dei branch dell'editor non propone più un falso branch «origin»: era l'HEAD del repository remoto, e sceglierlo staccava l'HEAD, facendo sparire il selettore."
    - "Cambiare account in una scheda non fa più andare in crash le schede rimaste aperte sull'account precedente: ora si ricaricano automaticamente sul nuovo account, o propongono di farlo se contengono IA non salvate (grazie a Portevent)."
    - "La pagina Notifiche non resta più vuota quando una notifica riguarda un porro che non è più nell'allevamento."
    - "#ai L'editor non va più in crash quando, in un'IA JavaScript o TypeScript, si clicca sul titolo della finestra delle definizioni o dei riferimenti per un simbolo dell'API: quel bersaglio non è uno dei tuoi file, e ora viene semplicemente ignorato (grazie a Hurracan)."
    - "La visualizzazione di un combattimento non si blocca più quando un'immagine non si carica (icona di PT/PM, di effetto o di stato): l'immagine mancante viene semplicemente ignorata invece di interrompere tutto il rendering."
    - "La visualizzazione di un combattimento sulla mappa fabbrica non va più in errore quando lo scenario viene ridisegnato durante il caricamento: le ombre dei bulloni sul terreno venivano disegnate prima di essere pronte (grazie a Nyctéis)."
    - "Applicare un equipaggiamento che si limita a investire capitale libero (ad esempio subito dopo una pozione di ridistribuzione) non consuma più una pozione: una pozione è richiesta solo quando una caratteristica va effettivamente ridotta (grazie a Smartiz)."
    - "#ai setLoadout() segue ora la stessa regola in combattimento: un equipaggiamento che aggiunge solo componenti, o che si limita a investire capitale libero, si applica senza pozione di ridistribuzione. E quando la pozione manca davvero, i componenti dell'equipaggiamento si applicano comunque invece di andare persi — un equipaggiamento che aggiungeva solo un SSD e una scheda madre lasciava il porro con le sue vecchie caratteristiche (grazie a Portevent)."
    - "#ai setLoadout() non applica più le caratteristiche di un equipaggiamento che richiede più capitale di quanto il porro ne abbia: la ripartizione viene rifiutata con un avviso, come nell'allevamento. Armi, chip e componenti si applicano comunque."
    - "#ai L'editor non va più in crash quando l'autocompletamento si chiude nell'istante preciso in cui la documentazione di una funzione o di una costante finisce di comparire accanto."
    - "Il quiz del tutorial ora dice perché non risponde: le caselle restavano mute, senza alcun messaggio, finché il capitolo precedente non era completato. Anche l'ordine delle risposte è mescolato meglio."
    - "Un chip o un componente i cui esemplari sono tutti equipaggiati sui tuoi porri ora appare nell'editor dei loadout, come le armi. Le liste di oggetti sono anche ordinate per livello (grazie a Kraspen)."
    - "La chat si aggiorna subito quando torni sull'app mobile o sulla scheda: i messaggi ricevuti durante la sospensione comparivano solo dopo diversi secondi, il tempo di accorgersi che la connessione in tempo reale era morta in silenzio e di ristabilirla."
    - "Gli oggetti acquistati in cristalli contano ora nella collezione, anche una volta equipaggiati: gli acquisti passati sono stati recuperati."
    - "La visualizzazione di un combattimento non si blocca più quando lo stesso stato viene applicato due volte di seguito dallo stesso chip sullo stesso bersaglio (l'invincibilità del Risveglio): i due stati si sommavano in uno stato inesistente, senza icona, e il rendering del combattimento si fermava di colpo."
    - "Gli effetti della Sciabola del deserto, della Lancia del sole e del Fucile quantistico mostrano finalmente l'icona della loro arma nella lista degli effetti sotto l'entità, invece di uno spazio vuoto."
    - "Il porro colpito dal Lanciafiamme brucia di nuovo, e quello colpito dal Gasatore si copre di gas: nessuna delle due animazioni si attivava più."
    - "Una Liberazione non toglie più lo stato Sterile: la riduzione si applicava all'identificatore dello stato, che diventava un altro stato e spariva dalla visualizzazione. Uno stato è tutto o niente, solo una riduzione totale (Esasperazione) lo toglie."
    - "L'icona dello stato Sterile passa dall'arancione al rosso, come si conviene a uno stato subito."
    - "Al mercato, espandere la riga grezza di un effetto e poi selezionare un altro oggetto ora aggiorna quella riga: conservava il tipo e i valori dell'oggetto precedente (grazie a pakalatak)."
    - "Una composizione che nessuno può più raggiungere nell'orto è ora inattiva in classifica, come un porro tolto dall'orto: appare in grigio e sparisce quando gli inattivi sono nascosti. Una composizione che perde porri esce dalla fascia di potenza delle composizioni del suo talento: manteneva il suo posto in cima alla classifica senza più rimettere in gioco il suo talento (grazie a tagadagain)."
    - "Pannello Git: i pulsanti «Aggiungi tutto allo stage», «Annulla tutto» e «Rimuovi tutto dallo stage» nelle intestazioni di sezione sono di nuovo visibili, erano ridotti a dimensione zero. Il pulsante Aggiorna interroga anche il repository remoto: i commit pubblicati nel frattempo compaiono subito, senza passare dal selettore dei rami (grazie a Tabarius)."
    - "Editor: un commento attaccato a un operatore resta grigio. La sequenza di operatori, ingorda, inghiottiva l'apertura del commento: «!/**/» non era colorato affatto, mentre «! /**/» lo era (grazie a LaLongueTerre)."
    - "Rapporto di combattimento: le frecce «<» e «>» dell'intestazione del turno tornano a spostarsi da un turno all'altro nel rapporto, invece di aprire il combattimento nel player. Il player resta raggiungibile tramite la freccia che compare a destra dell'intestazione (grazie a Tabarius)."
    - "Il tasto X in combattimento non rigenera più gli ostacoli della mappa: questa scorciatoia di test confondeva la visualizzazione, gli ostacoli visibili non corrispondevano più ai veri ostacoli del combattimento. Ora è riservato agli admin (grazie a LaLongueTerre)."

249:
