    - "10 nuovi trofei stagionali, riuniti in una categoria \"Stagioni\" dedicata. #img_249_season_trophies"
    - "#ai Scrivi le tue IA in JavaScript, Python o TypeScript oltre al LeekScript. #img_249_polyglot #img_249_js_ts_py"
    - "Pagina Collezione: monitora i tuoi progressi su armi, chip, cappelli e risorse. #img_249_collection"
    - "Paga con carta di credito nel negozio, tramite Stripe. #img_249_payment"
    - "Filtri per risultato e ricerca degli avversari nella cronologia dei combattimenti. #img_249_history_filters"
    - "Palette dei comandi nell'editor con Ctrl+Shift+P. #img_249_command_palette"
    - "Le risorse rilasciate da ogni porro sono mostrate nell'anteprima di un combattimento. #img_249_history_resources"
    - "I nomi dei porri sono mostrati nel tabellone dei tornei. #img_249_tournament_names"
    - "Opzione per aprire il rapporto invece del combattimento da una notifica. #img_248_notif_setting"
    - "Pagina contatti ridisegnata: canali di aiuto e social raggruppati. #img_249_contact"
    - "Pagina di manutenzione con un mini-gioco di corsa di porri. #img_249_maintenance"
    - "Avvia una demo di gruppo per provare Leek Wars in più persone, senza account."
    - "Messaggio di benvenuto nella chat per i nuovi iscritti."
    - "Notifiche push: attivale dalla pagina Notifiche per essere avvisato direttamente nel browser."
    - "#ai Covarianza del tipo di ritorno nella ridefinizione di un metodo. #img_249_covariant"
    - "#ai Accesso indicizzato opzionale con l'operatore `a?[b]`."
  improved:
    - "Numero di Pozioni di ripristino rimanenti visualizzato nell'orto, accanto al numero di combattimenti."
    - "La cronologia dei combattimenti si aggiorna in diretta, senza ricaricare la pagina."
    - "Pagine di articolo dedicate per il dev blog, indicizzate dai motori di ricerca."
    - "Il pagamento segue ora il tema chiaro o scuro del sito."
    - "Pulsante per rinnovare la vetrina di oggetti del negozio."
    - "Il tema dell'editor è automatico: chiaro o scuro come il sito."
    - "Casella IA di base alla creazione di un file, per partire dal codice d'esempio del linguaggio."
    - "Pulsante per riconfigurare i repository della GitHub App senza rimuoverla."
    - "Armi ordinate per livello nel selettore dell'avversario di prova."
    - "La classifica dei boss ricorda l'ultimo boss e la modalità consultati."
    - "La barra delle azioni di un topic si ripete in alto quando è lungo."
    - "Finestra che invita ad avviare il tutorial LeekScript. #img_249_tutorial_dialog"
    - "Icone dei trofei adattate alla modalità scura."
    - "Combattimenti compressi lato server per un archivio più leggero."
    - "I pacchetti di combattimenti acquistati arrivano nell'inventario (da attivare) invece di essere accreditati subito, utilizzabili dall'orto quando non hai più combattimenti."
    - "La rimozione automatica dall'orto dopo una serie di sconfitte richiede ora avversari distinti."
    - "#ai Le funzioni punto d'ingresso non sono più segnalate come inutilizzate."
    - "#ai Validazione delle IA Python nell'editor: nomi non definiti, errori di tipo e di sintassi segnalati in tempo reale."
  fixed:
    - "Grande revisione di qualità sulle traduzioni delle 17 lingue (completamenti ed errori)."
    - "#ai Numerose correzioni al compilatore e all'esecuzione LeekScript."
    - "#ai L'accesso opzionale `?.` e `a?[b]` non genera più falsi avvisi."
    - "#ai I messaggi di errore runtime non espongono più dettagli interni Java."
    - "Corpi di porri invisibili nei combattimenti su Firefox."
    - "Il guantone e il rinvaso non scambiano più il bersaglio sbagliato."
    - "Sezione della barra della vita mancante dopo una resurrezione."
    - "Diverse correzioni alle reazioni emoji, al codice e al LaTeX della chat."
    - "Ricerca del forum: corretti il loop di reindirizzamento e le categorie multilingua."
    - "Editor: pannello di divisione e cache del codice resi affidabili."
