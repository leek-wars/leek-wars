300:
  title: "Leek Wars 3.0: nuovo design, alterazioni, Leek Wars +, pagina iniziale e 6 nuovi chip."
  added:
    - "Leek Wars cambia faccia: un design tutto nuovo per l'intero sito. #img_300_design"
    - "Le alterazioni dei componenti: 36 oggetti per spingere un componente oltre i suoi valori. #img_300_alterations"
    - "26 trofei per l'officina delle alterazioni, di cui uno nascosto. 707 punti in palio. #img_300_alteration_trophies"
    - "Una pagina iniziale da comporre da soli: una griglia di widget da scegliere e disporre. #img_300_home #img_300_home_edit"
    - "Leek Wars +: un abbonamento di supporto a 3,99 € al mese, nulla di più forte in combattimento. #img_300_lwplus"
    - "Ricompense fedeltà Leek Wars +: una dal primo giorno, poi ogni 60 giorni. #img_300_lwplus_rewards"
    - "Trofei, cappelli, risorse rare, pozioni e apparati, fino a 7 anni di abbonamento."
    - "Orto rapido, con Leek Wars +: un pulsante avvia 5, 10 o 20 combattimenti. #img_300_fast_garden"
    - "In solo, allevatore, squadra e boss."
    - "Il lotto appare sotto l'orto, con il suo avanzamento."
    - "Un riepilogo somma talento, habs, XP, risorse, vittorie, trofei, bottino raro e durata."
    - "Dichiarazione dei multi-account: da Impostazioni > I miei account, dichiara i tuoi. #img_300_multiaccount"
    - "Ti seguono su tutti i dispositivi senza reinserire la password. #img_300_accounts"
    - "Appaiono sul tuo profilo. 3 account dichiarabili, 10 con un abbonamento."
    - "Gli account dichiarati di uno stesso giocatore non si incontrano più: orto, arena, tornei."
    - "Il matchmaking non propone più i tuoi altri account, e uno solo può iscriversi a un'arena."
    - "La ripartizione dei tornei li mette in tornei diversi."
    - "La classifica mostra una riga per giocatore e non per account. #img_300_ranking_players"
    - "Chi ha più account appare sotto il principale, con il numero di account che rappresenta."
    - "Un interruttore « Tutti gli account » rimette tutte le righe."
    - "Tre piante da evocare, fabbricabili alla forgia, con schemi che si trovano in combattimento. #img_300_plants"
    - "Il Peperoncino (livello 179), una torretta che sputa danni."
    - "Il Mais (livello 63), una fontana che cura la squadra intorno a sé."
    - "Il Prototassite (livello 152), colonna del Devoniano che non è né pianta né albero, 300-1300 PV."
    - "Nascono Radicate: né movimento né spinta, ma l'Inversione le rinvasa."
    - "Mostrano la loro zona d'effetto intorno a sé."
    - "Il Risveglio delle piante: il Mais e il Peperoncino non giocano più un turno proprio."
    - "Si svegliano quando un'entità entra nella loro zona di 3 caselle, una volta a turno ciascuna."
    - "Ogni risveglio rende tutti i PT e avanza le ricariche: il loro tempo si conta in risvegli."
    - "È la tua IA a decidere: la funzione affidata a summon() riceve l'entità appena entrata."
    - "Quattro chip che solo le piante possono lanciare, e che colpiscono più forte con più bersagli."
    - "Piccante e Capsaicina per il Peperoncino, Zucchero e Pop-corn per il Mais."
    - "I piccoli costano 3 PT e arrivano a 3 caselle; i grandi 6 PT e coprono tutta la zona."
    - "La Capsaicina brucia i nemici e li avvelena per 2 turni, il Pop-corn cura gli alleati."
    - "7 trofei per i nuovi chip e le piante. #img_300_chip_trophies"
    - "Nuovo chip Emorragia (livello 196): il bersaglio diventa Incurabile per 1 turno. #img_300_chips"
    - "Cure, furto di vita e rigenerazione bloccati, per 10 PT a portata 1-2. Si fabbrica alla forgia."
    - "Nuovo chip Maturazione (livello 267): +75 di vita massima e +5 di potenza su un'evocazione."
    - "Permanenti, irriducibili e cumulabili. In vendita al mercato."
    - "Nuovo chip Superinfezione (livello 232), da fabbricare alla forgia."
    - "Converte in danni immediati metà dei veleni che rodono il bersaglio."
    - "Nuova arma da mischia, la Sciabola del deserto (livello 151, leggendaria): 75-85 danni. #img_300_weapons"
    - "Il bersaglio diventa Sterile per 2 turni: non può più evocare."
    - "Si fabbrica alla forgia, con uno schema che si trova sulla mappa del deserto."
    - "Nuova arma, la Lancia del sole (livello 201): infilza una linea da 1 a 4 caselle."
    - "Respinge i bersagli di 4 caselle, 5 con un colpo critico."
    - "Si fabbrica con schegge solari del Solstizio, il suo schema cade in combattimento."
    - "4 nuovi cappelli: il Basco e il Cappello da chef nel negozio. #img_300_hats"
    - "Il Cappello da spiaggia e la Corona solare da fabbricare con le risorse del Solstizio."
    - "Nuovo apparato « Titolo dorato »: i tuoi titoli passano all'oro del podio. #img_300_golden_title"
    - "Il tuo e quelli dei tuoi porri, ovunque appaiano."
    - "È una ricompensa Leek Wars +, offerta dopo 9 mesi di abbonamento cumulato."
    - "5 nuovi trofei di fabbricazione: Apprendista, Artigiano, Fabbro, Ciclope ed Efesto. #img_300_craft_trophies"
    - "Per 1, 10, 100, 1000 e 10000 oggetti fabbricati alla forgia."
    - "Nuovo trofeo Tetrarca: vincere le quattro modalità d'arena nello stesso giorno. #img_300_arena_trophies"
    - "Un Battle Royale, una Guerra, una Caccia ai forzieri e un Colosso, con lo stesso porro."
    - "Nuovo trofeo Grande mischia: partecipare a un combattimento con 20 porri. #img_300_arena_trophies"
    - "Nuovo trofeo Dorato: raggiungere 10 000 punti trofeo."
    - "La console LeekScript diventa la Console: anche JavaScript, TypeScript e Python."
    - "Lo stato è conservato da una riga all'altra."
    - "#ai L'editor Python diventa un vero IDE. #img_300_python_ide"
    - "#ai Autocompletamento di funzioni, variabili e moduli, con inferenza dei tipi."
    - "#ai Hover su un simbolo, Ctrl+clic verso la definizione, e import risolti tra le tue IA."
    - "Il tutorial esiste ora in JavaScript e in Python oltre che in LeekScript."
    - "Ogni capitolo ha la sua versione nel linguaggio scelto."
    - "Chiavi API personali da creare dalle Impostazioni. #img_300_api_keys"
    - "Ogni chiave porta un ruolo (lettura pubblica, giocatore o account) che decide cosa apre."
    - "Mostra il suo utilizzo degli ultimi 14 giorni e si revoca con un clic."
    - "La documentazione dell'API è rifatta: oltre 300 servizi descritti e tradotti. #img_300_api_doc"
    - "Un esempio di chiamata pronto da copiare in cURL, JavaScript, Python e HTTP per ciascuno."
    - "La ricerca scava nelle descrizioni, un permalink per endpoint, e l'esportazione OpenAPI."
    - "Un server MCP ufficiale, npx @leekwars/mcp: un assistente di codice sul tuo account."
    - "Con una chiave API: leggere le tue IA, lanciare prove, leggerne i rapporti, la documentazione."
    - "Il grafico del talento si imposta su 7 o 30 giorni, con due pulsanti in alto. #img_300_talent_chart"
    - "Lo storico del talento è conservato 30 giorni invece di 7."
    - "I giorni precedenti a questa modifica restano vuoti sulla finestra lunga."
    - "Le notifiche su un tuo porro mostrano la sua miniatura accanto all'icona. #img_300_notifications"
    - "Quattro rapporti d'arena di fila si distinguono finalmente tra loro."
    - "La pagina di una squadra ha il suo pannello « In diretta », accanto alla chat. #img_300_team_live"
    - "Trofei sbloccati, soglie raggiunte e argomenti creati dai membri, su 7 giorni."
    - "I tuoi emoji preferiti: quelli che usi di più passano per primi. #img_300_emoji_favorites"
    - "Contano sia le reazioni sia gli emoji inviati nei messaggi."
    - "Appaiono nella barra di reazione della chat e in una scheda ⭐ del pannello."
    - "Ricerca nel pannello emoji: digita « gatto », « pizza » o « francia ». #img_300_emoji_search"
    - "Ritrovi un'emoji tra le 1746, nella tua lingua."
    - "La banca conserva lo storico dei tuoi acquisti di cristalli."
    - "Con il dettaglio di ciascuno e un link per rifarlo."
    - "Un pulsante « Esporta i miei dati » nelle Impostazioni."
    - "Profilo, porri, messaggi e argomenti del forum escono in un file da scaricare."
    - "#ai isBatchFight() dice se il combattimento viene da un lotto, per tacere quando si misura."
    - "#ai getStats(entità) rende tutte le statistiche in una mappa indicizzata dalle STAT_*."
  improved:
    - "Nel tema scuro anche le mappe si scuriscono: sfondo, decorazioni e ostacoli."
    - "La tinta notturna è dosata mappa per mappa: il ghiaccio e la spiaggia ne prendono di più."
    - "L'impostazione Modalità scura (tasto N) cambia tutte le mappe, non più solo il Nexus."
    - "Il pannello emoji passa a Unicode 16: 556 emoji aggiunte, doppioni rimossi. #img_300_emojis_unicode16"
    - "Le categorie seguono i 9 gruppi ufficiali, dagli smiley alle bandiere."
    - "I blocchi di codice della chat e del forum sono colorati secondo il loro linguaggio."
    - "LeekScript, JavaScript, TypeScript, Python, ma anche SQL, shell, HTML, CSS, XML, Java, PHP, YAML."
    - "Le anteprime seguono il tema dell'editor che hai scelto."
    - "Le faccine testuali (:) :/ :D ...) compaiono finalmente nei messaggi del forum, come in chat."
    - "Le classifiche dei boss si decidono sull'impresa e non più sull'anzianità."
    - "A parità, « Il più veloce » confronta il numero di porri poi il loro livello."
    - "« Meno porri » confronta i turni poi il livello, « Livello più basso » il contrario."
    - "La data della run decide solo come ultima risorsa."
    - "Classifiche dei boss: la colonna Livello mostra i livelli dei porri della run."
    - "Dal più alto al più basso, e raggruppati quando sono identici (« 301 ×4 »)."
    - "La potenza della squadra, criterio della classifica « Livello più basso », appare al passaggio."
    - "I trofei Medium e Oracolo diventano trofei bonus, senza punti né habs."
    - "Distruttore di Nasu, di Fenouil e di Potiron salgono a 30, 50 e 80 punti."
    - "Il totale resta tondo a 18 000 punti, e tutti i punteggi trofei sono stati ricalcolati."
    - "Il trofeo Spadaccino richiede anche di vincere senza alcun chip offensivo."
    - "Danni, veleno, rinvio, evocazione: oltre alle sole armi da mischia, come il trofeo Ninja."
    - "Le armi fabbricabili compaiono nella collezione e al mercato. #img_300_weapons"
    - "In grigio finché non si trova il diagramma, con un pulsante Fabbrica."
    - "Porta all'inventario mettendo gli ingredienti direttamente nella forgia."
    - "La forgia segnala in rosso gli ingredienti mancanti."
    - "Rifiuta la fabbricazione finché non ci sono tutti."
    - "Nel tabellone, il percorso del vincitore è tracciato in oro, caselle comprese."
    - "Quello dei tuoi partecipanti è verde, e le linee grigie si leggono finalmente nel tema scuro."
    - "Le caselle prendono il taglio smussato degli avatar, e i nomi sono meno troncati."
    - "Il tabellone del torneo sta nell'altezza dello schermo, senza sbordare in basso."
    - "La larghezza in eccesso è distribuita tra i turni, che si allontanano invece di ingrandirsi."
    - "I pacchetti di combattimenti si usano direttamente dall'orto."
    - "Un pacchetto comprato in Habs o cristalli entra subito nella lista dei pacchetti disponibili."
    - "Su mobile, l'ordine dei porri e le azioni del combattimento appaiono sotto il lettore."
    - "Dalla pagina di un combattimento, un pulsante riporta al torneo, all'orto o all'editor."
    - "L'apparato « Impugna un'arma » propone tutte le tue armi, non solo quelle equipaggiate."
    - "L'eliminazione dell'account è ora possibile per i creatori di squadra."
    - "La squadra passa al membro più anziano, o viene sciolta se il creatore era solo."
    - "Gruppi privati: la modalità « account con password » si regola nelle impostazioni del gruppo."
    - "Credenziali scelte dal supervisore, senza e-mail dei membri. I gruppi demo la attivano."
    - "Il linguaggio di programmazione si sceglie all'iscrizione, con i loghi."
    - "Le statistiche mostrano la ripartizione delle IA tra LeekScript, JavaScript, TypeScript e Python."
    - "Un interruttore nella pagina delle notifiche per ricevere, o no, le notifiche push."
    - "Trabucco: non serve più la linea di vista, ma il tempo di ricarica passa da 3 a 5 turni."
    - "Il bottino di risorse di stagione è due volte più frequente in arena."
    - "Le condizioni generali passano alla versione 2: l'automazione con uno strumento esterno è permessa."
    - "Anche i gruppi scolastici hanno il loro quadro."
    - "#ai L'API JavaScript, TypeScript e Python diventa 100% orientata agli oggetti."
    - "#ai Niente più funzioni o costanti globali: tutto passa da Fight, me, Weapon.pistol, Color…"
    - "#ai La stdlib LeekScript lascia il posto ai nativi del linguaggio (Math, JSON, random…)."
    - "#ai Tipi dell'API affinati: le famiglie di costanti sono indicate nelle firme."
    - "#ai Entity.Stat, Fight.Use, Item.Area… e Item porta ciò che armi e chip hanno in comune."
    - "#ai I registri sono tipizzati come testo (grazie a Nyaleph)."
    - "#ai Attenzione: il ritorno di Registers.delete, o un registro letto come numero, dà errore."
    - "#ai Usa parseInt."
    - "#ai Effect.item restituisce ora l'arma o il chip stesso, invece del suo numero."
    - "#ai Si risale a un oggetto dal suo identificatore: Cell.get, Entity.get, Weapon.get, Chip.get."
    - "#ai Gli oggetti restituiti dall'API sono condivisi e in sola lettura, quindi confrontabili."
    - "#ai EFFECT_MODIFIER_* e EFFECT_TARGET_* diventano Effect.Modifier.* e Effect.Target.*."
    - "#ai Le funzioni di puntamento si chiamano ora su Fight, e non più solo su me."
    - "#ai Fight.weaponCells, Fight.chipCell, Fight.weaponTargets… l'arma equipaggiata è un default."
    - "#ai Fight.weaponCells(cella, nemico.weapon) dice da dove il nemico può colpire quella cella."
    - "#ai Restano richiamabili su me (grazie a GSoMan)."
    - "#ai Lo switch non prova più i casi uno per uno quando sono tutti numeri o testi costanti."
    - "#ai Il ramo giusto viene trovato direttamente, e lo switch costa una sola operazione."
    - "#ai Uno switch di 10 casi su testi passa da 71 a 8 operazioni per passaggio."
    - "#ai Confrontare due oggetti con == o != è circa 3 volte più veloce."
    - "#ai Il confronto è diretto, senza la lunga serie di controlli di tipo di prima."
    - "#ai Array, mappe e insiemi continuano a confrontarsi sul loro contenuto."
    - "#ai Le costanti deprecate non sono più proposte in JavaScript, TypeScript e Python."
    - "#ai EFFECT_BUFF_FORCE, USE_FAILED… esistono solo i nomi attuali (grazie a WiseMan)."
    - "#ai La documentazione delle costanti STATE_* elenca le armi e i chip che applicano lo stato."
    - "#ai Il pannello dei problemi non si apre più all'arrivo quando non c'è nulla da mostrare."
  fixed:
    - "Modalità Colosso: i PV dei bulbi evocati dal colosso sono finalmente sincronizzati."
    - "Il loro bonus di statistiche era contato due volte: un bulbo sembrava tre volte più resistente."
    - "Moriva con la barra della vita a due terzi. Anche i combattimenti registrati si rivedono bene."
    - "La pagina Inventario non va più in crash al primo bottino di una nuova stagione."
    - "Le risorse di una stagione sono ora pubblicate il giorno prima del suo inizio."
    - "Un combattimento non si blocca più se un chip applica due volte lo stesso stato al bersaglio."
    - "Era il caso dell'invincibilità del Risveglio: i due stati si sommavano in uno inesistente."
    - "La visualizzazione di un combattimento non si blocca più se un'immagine non si carica."
    - "Icona di PT, PM, effetto o stato: l'immagine mancante viene semplicemente ignorata."
    - "Un combattimento sulla mappa fabbrica non va più in crash se lo sfondo è ridisegnato."
    - "Le ombre dei bulloni del suolo erano disegnate prima di essere pronte (grazie a Nyctéis)."
    - "Cambiare account in una scheda non fa più andare in crash le schede rimaste sull'altro."
    - "Si ricaricano sul nuovo account, o te lo propongono se un'IA non è salvata."
    - "Git: push, pull e aggiornamento funzionano qualunque sia il nome del repository remoto."
    - "Un remote diverso da « origin » faceva fallire tutto su « transport 'file' not allowed »."
    - "Lasciava anche il selettore dei rami senza alcun ramo remoto."
    - "Il fallimento di un aggiornamento è ora mostrato invece di passare inosservato."
    - "Il selettore dei rami non propone più un falso ramo « origin »."
    - "Era la HEAD del repository remoto, e sceglierla faceva sparire il selettore."
    - "Pannello Git: « Indicizza tutto », « Annulla tutto » e « Deindicizza tutto » sono di nuovo visibili."
    - "Quei pulsanti d'intestazione erano ridotti a dimensione zero."
    - "Aggiorna interroga anche il remoto: i commit inviati appaiono subito."
    - "L'editor non genera più un errore a ogni tasto sui vecchi Safari (iOS 15)."
    - "Il rilevamento dei colori di Monaco usava un'espressione che quei browser non capiscono."
    - "Le pozioni di restat regalate con l'aggiornamento dei componenti sono finalmente contate."
    - "Sia applicando dalla pagina del porro, sia con setLoadout() a inizio combattimento."
    - "Chi aveva solo quelle si vedeva rifiutare il restat (grazie a Nyaleph e Smartiz)."
    - "Applicare un equipaggiamento che investe solo capitale libero non consuma più una pozione."
    - "Una pozione serve solo quando bisogna davvero ridurre una caratteristica (grazie a Smartiz)."
    - "Una composizione che nessuno può più sfidare nell'orto diventa inattiva in classifica."
    - "Come un porro uscito dall'orto: in grigio, e nascosta insieme agli inattivi."
    - "Perdendo porri usciva dalla fascia di potenza delle composizioni del suo talento."
    - "Restava in testa senza più rimettere in gioco il suo talento (grazie a tagadagain)."
    - "Il trofeo Imboscato non si sblocca più su una casella perfettamente raggiungibile a piedi."
    - "Le zone irraggiungibili erano individuate prima che le torrette liberassero gli ostacoli."
    - "Un difetto di calcolo tagliava anche in due una zona in realtà tutta d'un pezzo."
    - "Bastava un teletrasporto banale. Gli sblocchi sono stati tolti, gli habs restano acquisiti."
    - "La modalità preferita in arena non cambia più da sola."
    - "Il comando /br iscriveva senza preferenza, e un cambio dal menu veniva poi dimenticato."
    - "La chat si aggiorna subito al ritorno sull'app mobile o sulla scheda."
    - "I messaggi ricevuti in pausa aspettavano che la connessione, morta in silenzio, tornasse."
    - "Gli oggetti comprati in cristalli contano nella collezione, anche una volta equipaggiati."
    - "Gli acquisti passati sono stati recuperati."
    - "Officina: il carico annunciato durante la composizione di una ricetta è quello raggiunto davvero."
    - "Sommava la potenza grezza delle alterazioni."
    - "Ma rialzare una caratteristica scavata da una rottura costa solo un quarto della sua potenza."
    - "Prometteva 136 per 103 consegnati rialzando un cuore perso."
    - "Un chip o un componente interamente equipaggiato appare finalmente nell'editor di equipaggiamenti."
    - "Le liste di oggetti sono anche ordinate per livello (grazie a Kraspen)."
    - "Il quiz del tutorial dice ora perché non risponde."
    - "Le caselle restavano mute finché il capitolo precedente non era terminato."
    - "Anche l'ordine delle risposte è mescolato meglio."
    - "Le composizioni di squadra si gestiscono finalmente con il dito."
    - "Il trascinamento funzionava solo col mouse, e la pressione lunga apriva il menu del browser."
    - "Una pressione lunga afferra il porro, la pagina scorre da sola, e il rilascio lo deposita."
    - "Rapporto: le frecce « < » e « > » dell'intestazione navigano di nuovo di turno in turno."
    - "Aprivano il combattimento nel player, ancora raggiungibile dalla freccia a destra."
    - "Il tasto X in combattimento non rigenera più gli ostacoli della mappa."
    - "Questa scorciatoia di test confondeva la vista: ora è solo per admin (grazie a LaLongueTerre)."
    - "Gli ostacoli delle mappe boss appaiono alla loro dimensione reale sulla mappa degli spostamenti."
    - "Bastioni del castello, torii… lasciavano buchi che sembravano percorribili (grazie a TheScout)."
    - "Le emoji composte apparivano a pezzi nella chat e nel forum."
    - "Famiglie 👨‍👩‍👧, bandiera arcobaleno, fenice, tonalità di pelle, per chi non ha un font emoji."
    - "Le emoji recenti apparivano come quadrati vuoti su Linux e sui vecchi Android."
    - "Il font di ripiego del sito era del 2019: ora è vettoriale e aggiornato."
    - "Si scarica a pezzi invece che in un blocco da 9 MB."
    - "La Sciabola del deserto, la Lancia del sole e il Fucile quantico mostrano l'icona della loro arma."
    - "I loro effetti apparivano in uno spazio vuoto sotto l'entità."
    - "Il porro colpito dal Lanciafiamme brucia di nuovo, e il Gasatore lo copre di gas."
    - "Nessuna delle due animazioni partiva più."
    - "Una Liberazione non toglie più lo stato Sterile."
    - "La riduzione si applicava all'id dello stato, che diventava un altro stato e spariva."
    - "Uno stato è tutto o niente: solo una riduzione totale (Esasperazione) lo toglie."
    - "L'icona dello stato Sterile passa dall'arancione al rosso, come per ogni stato subito."
    - "Al mercato, aprire la riga grezza di un effetto e cambiare oggetto aggiorna finalmente la riga."
    - "Manteneva il tipo e i valori dell'oggetto precedente (grazie a pakalatak)."
    - "La pagina Notifiche non resta più vuota quando una notifica riguarda un porro uscito."
    - "Il ruolo referente diventa discreto come gli altri in modalità discreta (grazie a Portevent)."
    - "Le stagioni iniziano e finiscono a mezzanotte ora francese, non più alle 2 del mattino."
    - "Editor: un commento attaccato a un operatore resta in grigio."
    - "La sequenza di operatori inghiottiva l'apertura: « !/**/ » restava nero (grazie a LaLongueTerre)."
    - "Documentazione: durante una ricerca, le categorie si richiudono di nuovo con la freccia."
    - "Chat: un $ dentro un blocco di codice non mette più tag &lt;latex&gt; (grazie a fujiwar)."
    - "#ai Python: le operazioni sono contate per espressione, come in LeekScript e JavaScript."
    - "#ai Ogni operatore, chiamata, lettura o iterazione conta 1, e il ×5 per riga sparisce."
    - "#ai Una riga densa costa il suo vero lavoro, e min(a, b) non costa più decine di operazioni."
    - "#ai Le funzioni di combattimento costano lo stesso numero di operazioni in ogni linguaggio."
    - "#ai useWeapon 3 000, getCellToUseWeapon 38 080, getEnemies 100… non solo il prezzo della chiamata."
    - "#ai In cambio, il codice interno dell'API (me.cell, min(), list()…) non costa più il suo."
    - "#ai I costi delle funzioni matematiche sono ora misurati sul motore reale."
    - "#ai cos(), sin(), acos() passano da 30 a 3, pow() da 140 a 7, hypot() da 187 a 2, log() da 39 a 4."
    - "#ai sqrt() passa da 8 a 3, cbrt() da 62 a 5 e length() da 15 a 1."
    - "#ai I nativi equivalenti in JS, TS e Python costano ora lo stesso (grazie a GSoMan)."
    - "#ai Python: math.cbrt() e math.exp2() sono ora disponibili."
    - "#ai La doc di min(), max(), log(), log2(), log10() e sqrt() descrive il vero comportamento Python."
    - "#ai Una pagina dell'enciclopedia può avere una sezione « Python » o « TypeScript »."
    - "#ai Descrive cosa fa di diverso la funzione, e appare solo in quel linguaggio."
    - "#ai log(), log2(), log10(), sqrt(), min(), max(), string() e substring() ne hanno una."
    - "#ai Convertire un oggetto dell'API in testo dà ora il suo tipo e il suo id."
    - "#ai str(cell) o String(cell) rendono Cell(42) o Leek(3), invece di un testo illeggibile."
    - "#ai Passare un'arma a me.weaponCell, me.weaponCells o me.canUseWeapon funziona finalmente."
    - "#ai La lista tornava vuota, e in Python la parola chiave weapon era rifiutata."
    - "#ai Questi metodi prendono prima il bersaglio e poi l'arma; l'ordine inverso resta accettato."
    - "#ai Il Bazooka al plutonio ha finalmente la sua costante WEAPON_PLUTONIUM_BAZOOKA."
    - "#ai Era l'unica arma senza: ora appare nella documentazione e nel completamento."
    - "#ai Weapon.plutoniumBazooka non è più segnalato come errore (grazie a DesignThinkerer)."
    - "#ai Field.distance restituisce una distanza in caselle, come Cell.distance e Entity.distance."
    - "#ai La distanza in linea d'aria resta in Field.euclideanDistance (grazie a GSoMan)."
    - "#ai Assegnare un campo tipizzato tramite una variabile non tipizzata applica le giuste conversioni."
    - "#ai Il combattimento falliva su un falso errore « campo sconosciuto » (grazie a Bily)."
    - "#ai setLoadout() segue la stessa regola in combattimento, e si applica senza pozione."
    - "#ai Quando la pozione manca davvero, i componenti si applicano comunque invece di perdersi."
    - "#ai Un equipaggiamento con solo un SSD lasciava il porro invariato (grazie a Portevent)."
    - "#ai setLoadout() non applica più le caratteristiche di un equipaggiamento troppo costoso."
    - "#ai La ripartizione è rifiutata con un avviso; armi, chip e componenti si applicano comunque."
    - "#ai Leggere o scrivere un campo statico privato dall'esterno è segnalato in compilazione."
    - "#ai Errore in modalità stretta, avviso altrimenti: prima la scrittura passava (grazie ad Amal)."
    - "#ai Una sottoclasse il cui genitore ha un costruttore privato non si istanzia più in silenzio."
    - "#ai La chiamata implicita al costruttore del genitore è segnalata (grazie a nytope)."
    - "#ai setContains() e mapContainsKey() costano 1 operazione invece di 2, come l'operatore in."
