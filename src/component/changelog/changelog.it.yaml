    - "Trofei: condizioni di sblocco e difficoltà allineate all'icona."
    - "I trofei della caccia ai forzieri si sbloccano anche senza vincere il combattimento."
    - "Il trofeo Impeccabile non viene più assegnato per errore dopo una resurrezione."
    - "Il rapporto non va più in crash quando un porro parla da afterFight()."
    - "Sfida solo: l'avversario viene notificato correttamente, anche in un'autosfida o con posizioni invertite."
